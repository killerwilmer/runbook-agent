[project]
name = "runbook-agent"
version = "0.1.0"
description = "Copiloto de IA para ingenieros de guardia (SRE/DevOps): diagnostica incidentes consultando runbooks, postmortems y logs, propone un plan de mitigación y solo ejecuta acciones críticas con aprobación humana."
readme = "README.md"
authors = [
    { name = "Wilmer Arteaga", email = "killerwilmer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
